  <figure class="slide on" role="group" aria-roledescription="slide" aria-label="1 of 9"><img src="/pitch-deck/slide-1-1600.jpg" srcset="/pitch-deck/slide-1-1600.jpg 1600w, /pitch-deck/slide-1-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" fetchpriority="high" draggable="false" alt="Slide 1. GenClass, AI runtime self healing: an AI runtime that detects and fixes bugs in real time, protecting web apps from AI slop. Pre-seed, October 2026."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="2 of 9"><img src="/pitch-deck/slide-2-1600.jpg" srcset="/pitch-deck/slide-2-1600.jpg 1600w, /pitch-deck/slide-2-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 2, problem. 82% of companies have had AI-written code break in production; $600B lost to downtime every year by the world's 2,000 largest companies; 17% of shoppers have abandoned a checkout because the site had errors; 30 of 30 engineers interviewed fix these bugs by hand."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="3 of 9"><img src="/pitch-deck/slide-3-1600.jpg" srcset="/pitch-deck/slide-3-1600.jpg 1600w, /pitch-deck/slide-3-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 3, why now. We built thousands of AI-generated stores with Daybot, our first product, and the same bugs kept showing up at runtime: broken CSS, two people ordering at once, pages that did not load, confusing buttons."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="4 of 9"><img src="/pitch-deck/slide-4-1600.jpg" srcset="/pitch-deck/slide-4-1600.jpg 1600w, /pitch-deck/slide-4-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 4, product. A 10 MB AI that fixes bugs live: an invisible button made readable, and a double charge blocked. The model is small enough to ship inside an npm library and run in every user's browser."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="5 of 9"><img src="/pitch-deck/slide-5-1600.jpg" srcset="/pitch-deck/slide-5-1600.jpg 1600w, /pitch-deck/slide-5-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 5, traction. We launched on October 8. Here's week one: 2,021 npm downloads in the first five days; 8.1 GB of our model sent to browsers by jsDelivr this month; 1,484 live events tracked by our dashboard in week one; [10] companies running GenClass. AI agents love our library: just by constantly shipping to npm we've gained 2,000+ downloads organically."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="6 of 9"><img src="/pitch-deck/slide-6-1600.jpg" srcset="/pitch-deck/slide-6-1600.jpg 1600w, /pitch-deck/slide-6-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 6, business model. Free and open source to install; Pro at $99 a month for the dashboard with analytics and P0/P1 email alerts; Custom at $599 a month with a model trained on your own app. $70B is spent each year on testing and monitoring software; one-year target $50M ARR."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="7 of 9"><img src="/pitch-deck/slide-7-1600.jpg" srcset="/pitch-deck/slide-7-1600.jpg 1600w, /pitch-deck/slide-7-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 7, competition. Build time is crowded with coding assistants; at runtime, monitoring tools report crashes only. GenClass catches and fixes bugs live."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="8 of 9"><img src="/pitch-deck/slide-8-1600.jpg" srcset="/pitch-deck/slide-8-1600.jpg 1600w, /pitch-deck/slide-8-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 8, team. Mehar Khanna and Karanvir Khanna, co-founders, built the runtime, the AI model and its training data themselves."></figure>
  <figure class="slide" role="group" aria-roledescription="slide" aria-label="9 of 9"><img src="/pitch-deck/slide-9-1600.jpg" srcset="/pitch-deck/slide-9-1600.jpg 1600w, /pitch-deck/slide-9-2560.jpg 2560w" sizes="(max-aspect-ratio: 16/9) 100vw, calc(178vh - 170px)" width="1600" height="900" decoding="async" loading="lazy" draggable="false" alt="Slide 9, vision. GenClass running in the background of every software: now a 10 MB model fixing bugs inside web apps, next the dashboard every dev team checks each morning, then GenClass on every web page by default."></figure>
