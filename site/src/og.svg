<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Source of public/og.png (1200x630), in genclass.dev's black design (site/src/css/base.css). The canvas is
       square and the card is centred in it (../og.sh crops the middle 630 rows). The text is set in Satoshi and
       JetBrains Mono, which a Mac does not have installed: render it where those web fonts load (a Chromium page that
       inlines this SVG under the site's font links, on the train VM), not with qlmanage, or the type falls back.
       The headline is HEADLINE in build.py; the console lines are real output from packages/runtime/README.md. -->
  <rect width="1200" height="1200" fill="#000000"/>
  <g transform="translate(0,285)">
    <image x="64" y="60" width="40" height="40" href="../public/brand/mark-512.png"/>
    <text x="118" y="91" font-family="Satoshi, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="30" letter-spacing="-0.6" fill="#F0F1E9">GenClass</text>
    <image x="872" y="56" width="264" height="264" href="../public/brand/mark-512.png"/>
    <text x="64" y="226" font-family="Satoshi, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="72" letter-spacing="-3.6" fill="#F0F1E9">Catch the bugs that</text>
    <text x="64" y="306" font-family="Satoshi, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="72" letter-spacing="-3.6" fill="#F0F1E9">never throw.</text>
    <text x="64" y="386" font-family="Satoshi, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="72" letter-spacing="-3.6" fill="#2FD07F">Then stop them.</text>
    <rect x="64.5" y="452.5" width="1071" height="121" fill="#0B0B0A" stroke="#30312B" stroke-width="1"/>
    <text x="88" y="490" font-family="'JetBrains Mono', Menlo, monospace" font-size="16" fill="#88897F">[GenClass] Model ready (genclass-runtime-r17, wasm, q8, 0.43s). Mode: observe.</text>
    <text x="88" y="518" font-family="'JetBrains Mono', Menlo, monospace" font-size="16" fill="#5BE39B">[GenClass] Flagged a stale response: search.results was written twice by other operations</text>
    <text x="88" y="546" font-family="'JetBrains Mono', Menlo, monospace" font-size="16" fill="#5BE39B">since its operation (#6) started, last 0.69s ago by GET /api/search?q=reac (#8). (stale, 0.96)</text>
  </g>
</svg>
