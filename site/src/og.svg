<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Source of public/og.png (1200x630). The canvas is square and the card is centred in it because macOS
       qlmanage, which ../og.sh uses to rasterise it, keeps a square SVG at 1:1; og.sh crops the middle 630 rows.
       The headline is HEADLINE in build.py; the console lines are real output from packages/runtime/README.md. -->
  <rect width="1200" height="1200" fill="#FFFFFF"/>
  <g transform="translate(0,285)">
    <image x="64" y="56" width="262" height="63" href="../public/brand/wordmark-600.png"/>
    <image x="860" y="44" width="276" height="276" href="../public/brand/mark-512.png"/>
    <text x="64" y="232" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="-3" fill="#0E1F4D">The bugs that never</text>
    <text x="64" y="314" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="-3" fill="#0E1F4D">throw, <tspan fill="#14B86A">found in</tspan></text>
    <text x="64" y="396" font-family="Outfit, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="-3" fill="#14B86A">production.</text>
    <rect x="64" y="452" width="1072" height="122" rx="12" fill="#0B1736"/>
    <text x="88" y="490" font-family="'Geist Mono', Menlo, monospace" font-size="16.5" fill="#97A3C2">[GenClass] Model ready (genclass-runtime-r17, wasm, q8, 0.43s). Mode: observe.</text>
    <text x="88" y="518" font-family="'Geist Mono', Menlo, monospace" font-size="16.5" fill="#7EE2AE">[GenClass] Flagged a stale response: search.results was written twice by other operations</text>
    <text x="88" y="546" font-family="'Geist Mono', Menlo, monospace" font-size="16.5" fill="#7EE2AE">since its operation (#6) started, last 0.69s ago by GET /api/search?q=reac (#8). (stale, 0.96)</text>
  </g>
</svg>
