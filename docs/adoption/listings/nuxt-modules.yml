# The entry for nuxt.com/modules (the nuxt/modules repository, file modules/genclass.yml). Nothing is submitted from
# this repository; this is the draft and the steps, written 2026-10-24 from https://github.com/nuxt/modules (README,
# "Contribution" and "Schema") and its lib/categories.ts.
#
# Prerequisite: @genclass/nuxt 0.1.0 published on npm (the release workflow; AGENTS.md rule 9). The list reads the
# package's description, npm name and maintainers from npm, so the entry cannot be synced before that.
#
# Steps (a pull request, no issue first):
#   1. Fork https://github.com/nuxt/modules, clone it, `pnpm install`.
#   2. `pnpm sync genclass genclass-dev/GenClass-lib#main/packages/nuxt`
#      This writes modules/genclass.yml from the package on npm and the repository. Compare it with the entry below.
#   3. In the generated file set `category` (a value from lib/categories.ts; the choice below is "Monitoring &
#      Logging", where Sentry's module is; "Devtools" is the other candidate), and `type: 3rd-party`. Optionally add
#      icons/genclass.svg (an SVG of the logo) and reference it with `icon`.
#   4. Check `compatibility.nuxt` against what the module declares (packages/nuxt/src/module.ts: ">=3.17.0").
#   5. Open the pull request. The description must say what the module does without mentioning Nuxt or its versions.
#
# Note: the list asks modules that mainly load a third-party script (analytics, chat widgets, consent managers, ...)
# to go through Nuxt Scripts instead. @genclass/nuxt installs an npm library in the app's bundle; the model it loads
# on demand comes from jsDelivr (or self-hosting), which is a data download, not a script. Say so if asked.
#
# Fields marked "auto sync" in the schema (description, npm, maintainers) are refreshed from npm by the list's own
# tooling; the values below are what npm will show once the package is published. `maintainers` takes the npm
# maintainers' GitHub handles: replace the organisation with the personal handle(s) if that is preferred.

name: genclass
description: Reports race conditions, stale responses and duplicate submits in the browser while they happen, with a small local model; observe mode changes nothing
repo: genclass-dev/GenClass-lib#main/packages/nuxt
npm: '@genclass/nuxt'
icon: genclass.svg
github: https://github.com/genclass-dev/GenClass-lib
website: https://genclass.dev
learn_more: https://github.com/genclass-dev/GenClass-lib/tree/main/packages/nuxt
category: Monitoring & Logging
type: 3rd-party
maintainers:
  - name: GenClass
    github: genclass-dev
compatibility:
  nuxt: '>=3.17.0'
  requires: {}
