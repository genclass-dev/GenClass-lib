name: Site

# genclass.dev's own checks, separate from ci.yml so this file merges cleanly with branches that add jobs there.
# The scan-worker job in ci.yml (branch wave2/scan-launch) runs the same path test; running it twice costs seconds.
on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-path:
    name: "site: genclass.dev/<url> path rule (src/scan-path.js against every published file)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Path rule
        run: node --test site/check/scan-path.test.mjs
