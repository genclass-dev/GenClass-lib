# Experiment branch only (never merged): confirms the device-flow test race fixed on fix/device-poll-race.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delay:
    name: "delay: ${{ matrix.settle }} settle, browser click +${{ matrix.ms }} ms real"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        settle: [old, fixed]
        ms: [0, 3, 10, 100, 1000]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci --no-audit --no-fund
      - name: Use main's auth.test.ts (the old settle)
        if: matrix.settle == 'old'
        run: git show 4378fc1:telemetry-worker/test/auth.test.ts > telemetry-worker/test/auth.test.ts
      - name: Delay the browser's click
        run: node exp/inject-delay.mjs telemetry-worker/test/auth.test.ts ${{ matrix.ms }}
      - name: CLI device-flow tests
        working-directory: telemetry-worker
        run: |
          set +e
          npx vitest run test/auth.test.ts -t "CLI's own requests" > out.txt 2>&1
          code=$?
          cat out.txt
          { echo "### ${{ matrix.settle }} settle, +${{ matrix.ms }} ms: vitest exit $code"; echo '```'; grep -E "POLLS|✓|×|Tests " out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  loop:
    name: "loop: ${{ matrix.settle }} settle, full suite x40, 3 at once"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        settle: [old, fixed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci --no-audit --no-fund
      - name: Use main's auth.test.ts (the old settle)
        if: matrix.settle == 'old'
        run: git show 4378fc1:telemetry-worker/test/auth.test.ts > telemetry-worker/test/auth.test.ts
      - name: 40 rounds of 3 concurrent full runs
        working-directory: telemetry-worker
        run: |
          set +e
          runs=0; bad=0
          for i in $(seq 1 40); do
            for j in 1 2 3; do npx vitest run > "out-$i-$j.txt" 2>&1 & done
            for j in 1 2 3; do
              wait -n; runs=$((runs+1))
            done
            for j in 1 2 3; do
              if grep -q "Tests .*failed" "out-$i-$j.txt"; then
                bad=$((bad+1)); echo "round $i run $j failed:"; grep -E "FAIL |^\s+[+-] " "out-$i-$j.txt" | head -20
              fi
            done
          done
          echo "failed runs: $bad / $runs"
          { echo "### ${{ matrix.settle }} settle: failed runs $bad / $runs"; echo '```'; grep -h "FAIL " out-*.txt | sed 's/\x1b\[[0-9;]*m//g' | sort | uniq -c; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
