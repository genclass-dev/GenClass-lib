name: CI

on:
  push:
    branches: [main, runtime, mvp, mvp-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: "@genclass/runtime: typecheck, build, unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # onnxruntime-node (dev-only, for the model parity tests) would otherwise download CUDA binaries on Linux.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck -w @genclass/runtime

      - name: Build
        run: npm run build -w @genclass/runtime

      # Browser (Playwright) tests are excluded. Model parity tests skip without a model directory (GENCLASS_MODEL_DIR).
      # The perf budgets run in their own step: they time a 5,000-item store and are noisy next to parallel test files.
      - name: Unit tests
        working-directory: packages/runtime
        env:
          NODE_OPTIONS: --expose-gc
        run: npx vitest run --exclude "test/browser/**" --exclude test/review-perf.test.ts

      # Reported, not blocking: shared GitHub runners are ~10% slower than the machines these budgets were set on
      # (redux-style dispatch measured 1.08-1.10 ms vs its 1 ms bound on 2026-10-09). Run them on a quiet machine
      # before a release.
      - name: Perf budgets
        continue-on-error: true
        working-directory: packages/runtime
        env:
          NODE_OPTIONS: --expose-gc
        run: npx vitest run test/review-perf.test.ts --retry=2

  telemetry-worker:
    name: "telemetry-worker: unit tests (collector, dashboard)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (root lockfile; vitest is hoisted)
        run: ONNXRUNTIME_NODE_INSTALL=skip npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: telemetry-worker
        run: npx vitest run

  scan-worker:
    name: "scan-worker: typecheck, unit tests (URL rules, SSRF, request policy, score, report, HTTP) and the site's genclass.dev/<url> rule"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scan-worker/package-lock.json
      # scan-worker has its own lockfile (it is not a root workspace): @cloudflare/puppeteer stays out of the runtime.
      - name: Install
        working-directory: scan-worker
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: scan-worker
        run: npm run typecheck
      - name: Unit tests (node:test, browser binding mocked)
        working-directory: scan-worker
        run: npm test
      - name: Site worker path rule
        run: node --test site/check/scan-path.test.mjs

  # The scanner's visual checks are the runtime's own lazy visual chunk (packages/runtime/dist/visual/index.js) from
  # branch wave2/visual at VISUAL_REF, bundled with scan-worker/visual/scan-entry.js into src/visual-source.ts by
  # scan-worker/scripts/build-visual.sh. This job builds it from source, uploads it (artifact scan-visual), and fails
  # when the committed copy is not exactly that build.
  scan-visual:
    name: "scan-worker: build the visual chunk from wave2/visual and check the embedded copy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      VISUAL_REF: 6ae209fa272f4e1d1b8ebc080b9b8f1405e0e7ba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VISUAL_REF }}
          path: visual-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (wave2/visual)
        working-directory: visual-src
        run: npm ci --no-audit --no-fund
      - name: Build the runtime (wave2/visual)
        working-directory: visual-src
        run: npm run build -w @genclass/runtime
      - name: Bundle the scanner's visual source
        run: sh scan-worker/scripts/build-visual.sh "$GITHUB_WORKSPACE/visual-src" "$RUNNER_TEMP/visual-source.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: scan-visual
          path: |
            ${{ runner.temp }}/visual-source.ts
            visual-src/packages/runtime/dist/visual/index.js
      - name: The committed src/visual-source.ts is this build
        run: cmp scan-worker/src/visual-source.ts "$RUNNER_TEMP/visual-source.ts"
