# GenClass telemetry collector (Cloudflare Worker + R2).
# Deploy: npx --yes wrangler@4 deploy   (from this directory)
name = "genclass-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "144bd5f5270b51dbe7faf46227a154f0"
workers_dev = true
# Never log request contents: no observability/logpush of request bodies or headers.
logpush = false

# genclass.dev paths that the site (worker `genclass-site`, custom domain) does not serve. Routes run in front of
# the custom domain; unknown paths under /start* and /dashboard* are passed to the site (service binding SITE).
routes = [
  { pattern = "genclass.dev/dashboard*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/start*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/api/*", zone_name = "genclass.dev" },
  # Accounts (src/auth.ts). Unknown paths under these prefixes are handed to the site like the ones above.
  { pattern = "genclass.dev/login*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/signup*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/logout*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/account*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/auth/*", zone_name = "genclass.dev" },
]

# Account settings. Production uses the defaults in src/auth.ts (AUTH_ORIGIN https://genclass.dev, AUTH_RP_ID
# genclass.dev); local development overrides them in .dev.vars (see .dev.vars.example and the README).
# Secrets, set with `npx wrangler secret put` and never committed: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET. Without a pair, that provider's button is not shown; with neither pair,
# passkey sign-up is offered instead, so the site always has a way in.

# The newest @genclass/runtime on npm, on any dist-tag. Below 0.3.0-beta.0 the Connect panel, /start and private
# dashboards say first that project keys and `login` are not published yet. Set it to "0.3.0-beta.0" (then deploy) once
# release.yml has published the beta and jsDelivr serves it, and to "0.3.0" at 0.3.0 (with pages.ts SNIPPET_RUNTIME and
# RUNTIME_PKG).
[vars]
RUNTIME_ON_NPM = "0.3.0-beta.0"
# "on" sells Pro through Stripe Managed Payments: Stripe, through Link, is the merchant of record (sales tax and VAT,
# fraud, disputes, payment support; Link's name on the receipt and the card statement) for 3.5% of each Pro payment on
# top of Stripe's fees. "off" (and unset) sells Pro on standard Checkout, with GenClass the seller owing the tax; Custom
# never uses it. It stays "off" until the owner has accepted the Managed Payments terms in the Stripe dashboard and one
# test-mode Pro checkout with it "on" went through (Stripe's changelog lists the parameter under a newer API version
# than the pinned one; README "Owner steps"). Then set "on" and deploy.
MANAGED_PAYMENTS = "off"
# How many days a trial of Pro lasts (one per account, no card, no Stripe; src/trial.ts). Public copy never says the
# length: it says "Trials available". 1 to 60; anything else counts as 7.
TRIAL_DAYS = "7"

# Paid plans (README "Paid plans"), Worker secrets: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_WEBHOOK_SECRET_TEST, STRIPE_PORTAL_CONFIGURATION and STRIPE_PORTAL_CONFIGURATION_TEST (GenClass's Billing
# Portal configuration id; scripts/stripe-setup.mjs stores the ones for its key's mode), STRIPE_TEST_ACCOUNTS (who
# can buy while the key is a test key), INTEGRATIONS_KEY (32 random bytes, base64) and, optionally, NOTIFY_WEBHOOK.
# Without a live STRIPE_SECRET_KEY nothing is on sale to the public; trials, and the Free plan's limits, apply anyway.
# The key is for GenClass's own Stripe account ("GenClass"); the worker and the setup script still touch only
# GenClass's own objects there, as when the account was shared with Polar Parts (README "Shared-account defences").

[observability]
enabled = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "genclass-telemetry"

# Per-app tokens and dashboards (see README). D1 holds projects and aggregates; created 2026-10-10.
[[d1_databases]]
binding = "DB"
database_name = "genclass-dashboard"
database_id = "694d7d16-8a47-4810-8e0d-e9c89533460a"
migrations_dir = "migrations"

# Project creation: 10 per 60 s per client (keyed by a hash of the client IP, never stored).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "7301"
simple = { limit = 10, period = 60 }

# Batches per client IP: 1200 per 60 s, a ceiling for many pages behind one shared address (the runtime sends at most
# one every 10 s per page; the IP is never stored). The tight budget is per session, below.
[[ratelimits]]
name = "LIMIT"
namespace_id = "4802"
simple = { limit = 1200, period = 60 }

# Batches per session id (the body's sid): 30 per 60 s; one page sends about 6 a minute.
[[ratelimits]]
name = "SESSION_LIMIT"
namespace_id = "4803"
simple = { limit = 30, period = 60 }

# Sign-up, sign-in options and the CLI's device flow: 20 per 60 s per client IP and route (the key is a hash of the
# route and the IP; the IP is never stored).
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "7302"
simple = { limit = 20, period = 60 }

# Export pages (src/billing.ts): 120 per 60 s per account (the key is a hash of the account id).
[[ratelimits]]
name = "EXPORT_LIMIT"
namespace_id = "7303"
simple = { limit = 120, period = 60 }

# Read-only use of the site worker: unknown genclass.dev/start* and /dashboard* paths are handed to it unchanged.
[[services]]
binding = "SITE"
service = "genclass-site"

# Daily retention sweep of dashboard rows (03:17 UTC).
[triggers]
crons = ["17 3 * * *"]

