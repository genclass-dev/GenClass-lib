# The Terrible Vibe Coder on Cloudflare (worker.js). Deploy with ./deploy.sh (it copies GenClass into public/genclass/).
name = "terrible-vibe-coder"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "144bd5f5270b51dbe7faf46227a154f0"
workers_dev = true
logpush = false

[observability]
enabled = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/api/*"]

[[durable_objects.bindings]]
name = "VISITOR"
class_name = "Visitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Visitor"]
