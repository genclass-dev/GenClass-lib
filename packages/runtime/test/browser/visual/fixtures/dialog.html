<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog under a backdrop</title>
<script src="/dist/genclass.global.js" data-model="off" data-telemetry="off"></script>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #fff; }
  .wrap { transform: translateZ(0); }
  .modal { position: fixed; top: 120px; left: 120px; width: 420px; height: 260px; z-index: 1000; background: #fff; border: 1px solid #d1d5db; padding: 16px; }
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.45); }
</style>
</head>
<body>
<h1>Account</h1>
<div class="wrap"><div class="modal" role="dialog" aria-modal="true" aria-label="Delete account" data-k="dlg" data-expect="dialog-covered"><p>Delete your account?</p><button type="button">Cancel</button> <button type="button">Delete</button></div></div>
<div class="backdrop"></div>
</body>
</html>
