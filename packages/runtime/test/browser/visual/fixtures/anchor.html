<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor under a fixed header</title>
<script src="/dist/genclass.global.js" data-model="off" data-telemetry="off"></script>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #fff; }
  body { padding: 0; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 96px; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; }
  main { padding: 160px 24px 2400px; }
</style>
</head>
<body>
<header class="topbar"><strong>Docs</strong></header>
<main>
<p><a href="#pricing" id="jump">Jump to pricing</a></p>
<div style="height: 1200px"></div>
<h2 id="pricing" data-k="pricing" data-expect="focus-obscured">Pricing</h2>
<p>Plans start at twelve dollars.</p>
</main>
</body>
</html>
