<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control under a fixed bar</title>
<script src="/dist/genclass.global.js" data-model="off" data-telemetry="off"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #fff; }
  body { box-sizing: border-box; }
  .cta { position: absolute; bottom: 24px; left: 40px; padding: 10px 20px; font: inherit; }
  .dock { position: fixed; bottom: 0; left: 0; right: 0; height: 96px; background: #111827; color: #f9fafb; padding: 16px; }
</style>
</head>
<body>
<h1>Almost done</h1>
<button type="button" class="cta" data-k="cta" data-expect="control-unreachable">Continue</button>
<div class="dock">Questions? We reply within a day.</div>
</body>
</html>
