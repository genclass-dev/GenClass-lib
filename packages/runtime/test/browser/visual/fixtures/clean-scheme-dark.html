<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A dark-only page</title>
<script src="/dist/genclass.global.js" data-model="off" data-telemetry="off"></script>
<!-- color-scheme: dark and no background: the canvas is dark and the text light for every visitor, including one who
     prefers light. Correct in both schemes. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<h1>Night shift</h1>
<p>Light text on the dark canvas, with no background set anywhere.</p>
<p>Another paragraph with a <a href="#more">link</a>.</p>
</body>
</html>
